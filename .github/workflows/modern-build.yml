name: Modern Builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  forge-1-20-1:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/forge-1.20.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew test build --no-daemon

  neoforge-1-21-1:
    name: NeoForge 1.21.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: versions/neoforge-1.21.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew test build --no-daemon
